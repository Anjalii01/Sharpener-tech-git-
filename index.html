<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Manager</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <h1>Student Manager</h1>
      </div>
      <p class="subtitle">Add, edit and keep track of your students in one place</p>
    </header>

    <main class="layout">

      <!-- Form Card -->
      <section class="card form-card">
        <h2 id="formTitle">Add New Student</h2>
        <form id="studentForm" novalidate>
          <input type="hidden" id="studentId" />

          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="e.g. Anjali Singh" autocomplete="off" required />
            <span class="error" id="nameError"></span>
          </div>

          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="e.g. 9876543210" maxlength="10" autocomplete="off" required />
            <span class="error" id="mobileError"></span>
          </div>

          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" placeholder="e.g. Bokaro, Jharkhand" rows="3" required></textarea>
            <span class="error" id="addressError"></span>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="submitBtnText">Add Student</span>
            </button>
            <button type="button" id="cancelEditBtn" class="btn btn-ghost hidden">Cancel</button>
          </div>
        </form>
      </section>

      <!-- List Card -->
      <section class="card list-card">
        <div class="list-header">
          <h2>All Students</h2>
          <div class="list-header-right">
            <span class="count-badge" id="studentCount">0</span>
            <input type="search" id="searchInput" placeholder="Search by name or mobile..." />
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <span class="empty-icon">🗂️</span>
          <p>No students yet. Add your first student using the form.</p>
        </div>

        <div id="studentList" class="student-list"></div>
      </section>

    </main>

    <footer class="app-footer">
      <p>Data is saved locally in your browser · No backend required</p>
    </footer>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
